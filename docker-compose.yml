version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-yourusername}/litely-perplexed-backend:${VERSION:-latest}
    container_name: litely-perplexed-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - litely-perplexed-data:/data
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - BM25_WEIGHT=${BM25_WEIGHT:-0.5}
      - TOP_K=${TOP_K:-10}
      - FETCH_RESULTS=${FETCH_RESULTS:-20}
      - SUMMARY_SENTENCES=${SUMMARY_SENTENCES:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - litely-perplexed

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-yourusername}/litely-perplexed-frontend:${VERSION:-latest}
    container_name: litely-perplexed-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - litely-perplexed

volumes:
  litely-perplexed-data:
    name: litely-perplexed-data

networks:
  litely-perplexed:
    driver: bridge
