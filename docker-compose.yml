version: '3.8'

services:
  litely-perplexed:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-yourusername}/litely-perplexed:${VERSION:-latest}
    container_name: litely-perplexed
    ports:
      - "${PORT:-3000}:3000"     # Frontend & API
      - "${SEARXNG_PORT:-8080}:8080"  # SearXNG (optional direct access)
    volumes:
      - litely-perplexed-data:/data
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - BM25_WEIGHT=${BM25_WEIGHT:-0.5}
      - TOP_K=${TOP_K:-10}
      - FETCH_RESULTS=${FETCH_RESULTS:-20}
      - SUMMARY_SENTENCES=${SUMMARY_SENTENCES:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  litely-perplexed-data:
    name: litely-perplexed-data
